name: Android Lite APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-lite.yml'

concurrency:
  group: android-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-lite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Verify AndroidX is enabled
        working-directory: android
        run: grep -q '^android.useAndroidX=true$' gradle.properties

      - name: Download Whisper Tiny INT8
        working-directory: android
        run: bash scripts/fetch-whisper-tiny.sh

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqaab-subtide-android-lite
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
